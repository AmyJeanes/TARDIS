name: Generate Files

on:
  pull_request_target:
    branches:
    - main
    paths:
    - i18n/languages/*.json
    - scripts/generate-languages.ps1
    - .github/workflows/generate-files.yml
  push:
    branches:
    - main
    paths:
    - i18n/languages/*.json
    - scripts/generate-languages.ps1
    - .github/workflows/generate-files.yml

  workflow_dispatch:

jobs:
  generate_files:
    name: Generate Files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
        if: github.event_name == 'pull_request'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.TOKEN }}
        if: github.event_name != 'pull_request'

      - name: Generate Languages
        run: ./scripts/generate-languages.ps1
        shell: pwsh
        env:
          TARDIS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Git Auto Commit
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: "Update Generated Files"
